# Publica o app no GitHub Pages a cada push na main (inclui o merge de PR).
# Só publica se o npm test passar. Ambiente publicado: homologação (dados fictícios).
# Para trocar para produção: mudar AMBIENTE abaixo, depois da autorização da Maria Júlia.
name: publicar
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
env: {AMBIENTE: homologacao}
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/build.mjs --ambiente=$AMBIENTE
      - name: Montar o site
        run: |
          mkdir -p _site/css _site/dist
          cp index.html _site/
          cp css/app.css _site/css/
          cp dist/app.js _site/dist/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
